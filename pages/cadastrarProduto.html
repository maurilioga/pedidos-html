<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos APP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <header class="navbar navbar-dark sticky-top bg-primary flex-md-nowrap p-0 shadow">
        <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3 fs-6 text-white" href="#">Pedidos APP</a>
        <button class="navbar-toggler d-md-none collapsed" type="button" data-bs-toggle="offcanvas"
            data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
    </header>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div id="sidebar-container"></div>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-3">
                <section class="py-5 text-center container">
                    <div class="row py-lg-5">
                        <div class="col-lg-6 col-md-8 mx-auto mb-5">
                            <h1>Pedidos APP</h1>
                            <p class="display-2">Cadastrar Novo Produto</p>
                        </div>
                    </div>

                    <div class="container mt-4">
                        <form id="form-produto">
                            <div class="mb-3">
                                <label for="nome" class="form-label">Nome do Produto</label>
                                <input type="text" class="form-control border border-secondary" id="nome" name="nome" required>
                            </div>

                            <div class="mb-3">
                                <label for="valor" class="form-label">Valor Sugerido</label>
                                <input type="number" class="form-control border border-secondary" id="valor" name="valor" step="0.01" required>
                            </div>

                            <div class="mb-3">
                                <label for="quantidade" class="form-label">Quantidade</label>
                                <input type="number" class="form-control border border-secondary" id="quantidade" name="quantidade" required>
                            </div>

                            <button type="submit" class="btn btn-success">💾 Cadastrar Produto</button>
                        </form>

                        <div id="mensagem" class="mt-3"></div>
                    </div>


                </section>
                <script src="../scripts/sidebar.js"></script>
                <script src="../scripts/cadastrarProduto.js"></script>
            </main>
        </div>

        <footer class="rodape">

        </footer>
    </div>

    <footer class="rodape">

    </footer>
</body>

</html>
