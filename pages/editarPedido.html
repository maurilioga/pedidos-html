<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos APP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <header class="navbar navbar-dark sticky-top bg-primary flex-md-nowrap p-0 shadow">
    <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3 fs-6 text-white" href="#">Pedidos APP</a>
    <button class="navbar-toggler d-md-none collapsed" type="button" data-bs-toggle="offcanvas"
      data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
  </header>

  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <div id="sidebar-container"></div>

      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-3">
        <section class="py-5 container">
          <div class="row">
            <div class="col-lg-8 col-md-10 mx-auto mb-4">
              <h1 class="h3 mb-1">Pedidos APP</h1>
              <p class="display-6">Editar Pedido</p>
            </div>
          </div>

          <div class="container mt-2">
            <form id="form-pedido" class="col-lg-8 col-md-10 mx-auto">
              <!-- Cabeçalho -->
              <div class="mb-3">
                <label class="form-label">Cliente</label>
                <input id="nomeCliente" type="text" class="form-control border border-secondary" readonly>
                <div class="form-text">Campo somente leitura (editar cliente não faz parte desta tela).</div>
              </div>

              <div class="row g-3">
                <div class="col-md-6">
                  <label for="dataEntrega" class="form-label">Data de Entrega</label>
                  <input type="datetime-local" id="dataEntrega" class="form-control border border-secondary" required>
                </div>
              </div>

              <div class="mb-3 mt-3">
                <label for="observacao" class="form-label">Observação (opcional)</label>
                <textarea id="observacao" class="form-control border border-secondary" rows="2"></textarea>
              </div>

              <!-- Produtos do pedido -->
              <div class="mt-4">
                <h5 class="mb-2">Produtos neste pedido</h5>
                <ul id="listaProdutosPedido" class="list-group"></ul>
                <div class="form-text">Marque os itens que deseja remover ao salvar.</div>
              </div>

              <!-- Adicionar produto -->
              <div class="mt-4">
                <h5 class="mb-2">Adicionar produto</h5>
                <div class="row g-2 align-items-end">
                  <div class="col-md-7">
                    <label class="form-label">Produto</label>
                    <select id="selectProdutoAdd" class="form-select border border-secondary">
                      <option value="">Selecione um produto</option>
                    </select>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Quantidade</label>
                    <input type="number" id="inputQuantidadeAdd" class="form-control text-center border border-secondary" min="1" value="1">
                  </div>
                  <div class="col-md-2">
                    <button type="button" id="btnAddProduto" class="btn btn-info w-100">➕ Adicionar</button>
                  </div>
                </div>
                <ul id="listaProdutosAdicionar" class="list-group mt-2"></ul>
                <div class="form-text">Os itens adicionados aqui só serão enviados ao salvar.</div>
              </div>

              <!-- Ações -->
              <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-success">💾 Salvar alterações</button>
                <a href="index.html" class="btn btn-outline-secondary">↩️ Voltar</a>
              </div>

              <div id="mensagem" class="mt-3"></div>
            </form>
          </div>
        </section>

        <script src="../scripts/sidebar.js"></script>
        <!-- Script específico desta página -->
        <script src="../scripts/editarPedido.js"></script>
      </main>
    </div>

    <footer class="rodape"></footer>
  </div>

  <footer class="rodape"></footer>
</body>

</html>
